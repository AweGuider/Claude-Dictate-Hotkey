name: Release

# Pushing a tag such as v0.4.1 builds the downloads and attaches them to a pre-release for that
# tag. Release notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the script version
        shell: pwsh
        run: |
          $version = (Select-String -Path ClaudeDictateHotkey.ahk -Pattern '^;@Ahk2Exe-SetVersion\s+(\S+)').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $version in ClaudeDictateHotkey.ahk" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install AutoHotkey, Ahk2Exe and Inno Setup
        shell: pwsh
        run: .github/scripts/install-build-tools.ps1

      - name: Build exe, portable zip and installer
        shell: pwsh
        run: ./build.ps1 -Ahk2Exe $env:AHK2EXE -AhkBase $env:AHK -Iscc $env:ISCC

      - name: Write release notes from the changelog
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION))\b[^\r\n]*\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (-not $section) { throw "No '## $env:VERSION' section in CHANGELOG.md" }
          $notes = @(
              $section
              ''
              '## Download'
              ''
              "- **Installer:** ``ClaudeDictateHotkey-$env:VERSION-setup.exe`` (per-user, no admin rights)"
              "- **Portable:** ``ClaudeDictateHotkey-$env:VERSION-portable.zip``"
              ''
              'Not code-signed yet, so Windows SmartScreen or antivirus may warn. Verify downloads with `SHA256SUMS.txt`; see the README for details.'
          )
          $notes -join "`n" | Set-Content release-notes.md -Encoding utf8

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "dist/ClaudeDictateHotkey-$env:VERSION-setup.exe", "dist/ClaudeDictateHotkey-$env:VERSION-portable.zip", "dist/SHA256SUMS.txt"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --prerelease --notes-file release-notes.md --title "Claude Dictate Hotkey v$env:VERSION"
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the downloads to the release" }
